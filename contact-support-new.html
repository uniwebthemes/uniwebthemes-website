        /* Zoho container override */
        .zsFormClass {

        #zohoSupportWebToCase {
            width: 100%;
        }

        #zohoSupportWebToCase table {
            width: 100%;
        }

        #zohoSupportWebToCase td {
            padding: 0.75rem 0 !important;
            display: block;
        }

        #zohoSupportWebToCase input,
        #zohoSupportWebToCase textarea,
        #zohoSupportWebToCase select {
            width: 100% !important;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            transition: all 0.25s ease;

        #zohoSupportWebToCase input:focus,
        #zohoSupportWebToCase textarea:focus,
        #zohoSupportWebToCase select:focus {

            border-color: #ff6a00;
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.2);
            transform: translateY(-1px);
        }

        #zohoSupportWebToCase textarea {
            min-height: 120px;
        }

        /* Submit button */
        #zohoSupportWebToCase input[type="submit"] {
            background: linear-gradient(135deg, #ff6a00, #ff8c2a);
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 0.9rem;
            border-radius: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #zohoSupportWebToCase input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 106, 0, 0.35);
        }

        #zohoSupportWebToCase input[type="submit"].loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Hide Zoho branding footer spacing */
        .wb_FtCon {
            display: none !important;

</head>
