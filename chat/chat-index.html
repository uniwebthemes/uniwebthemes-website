<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Smooth open / close */
    .chat-hidden {
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      pointer-events: none;
    }

    .chat-visible {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .chat-transition {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Subtle shadow */
    .chat-shadow {
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Floating Chat Button -->
  <button
    id="chatToggle"
    class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-violet-600 text-white shadow-lg hover:bg-violet-700 transition"
  >
    💬
  </button>

  <!-- Chat Popup -->
  <div
    id="chatWidget"
    class="chat-hidden chat-transition chat-shadow fixed bottom-24 right-6 z-40 w-[360px] overflow-hidden rounded-2xl bg-white"
  >

    <!-- Header -->
    <div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-4 text-white">
      <div class="flex items-center gap-3">
        <img
          src="https://i.pravatar.cc/40"
          class="h-10 w-10 rounded-full border border-white/30"
        />
        <div>
          <h3 class="font-semibold leading-tight">Speakbee</h3>
          <p class="text-xs text-white/80">
            We will reply as soon as we can
          </p>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="h-[320px] space-y-4 overflow-y-auto p-4 text-sm">

      <!-- Incoming -->
      <div class="flex items-start gap-2">
        <img
          src="https://i.pravatar.cc/32?img=5"
          class="h-8 w-8 rounded-full"
        />
        <div class="max-w-[75%] rounded-xl bg-gray-100 px-4 py-2">
          Hey here! 👋 Want to connect with an expert to talk through our pricing?
        </div>
      </div>

      <!-- Outgoing -->
      <div class="flex justify-end">
        <div class="max-w-[75%] rounded-xl bg-violet-600 px-4 py-2 text-white">
          Yes, tell me more
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex gap-2">
        <button class="rounded-full border px-4 py-2 text-xs hover:bg-gray-50">
          Find pricing
        </button>
        <button class="rounded-full border px-4 py-2 text-xs hover:bg-gray-50">
          Talk to expert
        </button>
      </div>
    </div>

    <!-- Input -->
    <div class="flex items-center gap-2 border-t p-3">
      <input
        type="text"
        placeholder="Type your message..."
        class="flex-1 rounded-full border px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-500"
      />
      <button class="text-violet-600 hover:text-violet-700">
        ➤
      </button>
    </div>
  </div>

  <!-- JS -->
  <script>
    const toggle = document.getElementById("chatToggle");
    const widget = document.getElementById("chatWidget");

    let open = false;

    toggle.addEventListener("click", () => {
      open = !open;

      widget.classList.toggle("chat-hidden", !open);
      widget.classList.toggle("chat-visible", open);
    });
  </script>

</body>
</html>
